<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-labelledby="title description" xml:lang="de">
<title id="title">Thermostat mit Rückkopplung</title>
<desc id="description">Der Raum gibt die Temperatur an den Sensor vor. Dessen Messwert geht an den Regler. Der Regler schaltet die Heizung, die wiederum auf den Raum wirkt.</desc>
<defs><marker id="arrow" orient="auto" markerWidth="8" markerHeight="7" refX="7.4" refY="3.5"><path d="M0 0 L8 3.5 L0 7 Z" fill="#476174"/></marker></defs>
<rect width="960" height="480" fill="#fff"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="38" y="57" font-size="31" text-anchor="start" font-weight="700" fill="#17293a">Thermostat mit Rückkopplung</text>
<path d="M38 77 H922" stroke="#bac5cf" stroke-width="1.4"/>
<path d="M356.0 165.0 Q480.0 165.0 604.0 165.0" fill="none" stroke="#476174" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="439.0" y="139.0" width="82" height="22" rx="4" fill="#fff"/>
<text x="480.0" y="155.0" font-size="17" text-anchor="middle" font-weight="400" fill="#17293a">Messwert</text>
<path d="M720.0 198.0 Q720.0 260.0 720.0 322.0" fill="none" stroke="#476174" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="661.0" y="234.0" width="118" height="22" rx="4" fill="#fff"/>
<text x="720.0" y="250.0" font-size="17" text-anchor="middle" font-weight="400" fill="#17293a">Schaltbefehl</text>
<path d="M604.0 355.0 Q480.0 355.0 356.0 355.0" fill="none" stroke="#476174" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="452.5" y="329.0" width="55" height="22" rx="4" fill="#fff"/>
<text x="480.0" y="345.0" font-size="17" text-anchor="middle" font-weight="400" fill="#17293a">Wärme</text>
<path d="M240.0 322.0 Q240.0 260.0 240.0 198.0" fill="none" stroke="#476174" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="190.0" y="234.0" width="100" height="22" rx="4" fill="#fff"/>
<text x="240.0" y="250.0" font-size="17" text-anchor="middle" font-weight="400" fill="#17293a">Temperatur</text>
<rect x="124.0" y="132.0" width="232" height="66" rx="10" fill="#f2f7fb" stroke="#476174" stroke-width="2"/>
<text x="240" y="160.0" font-size="22" text-anchor="middle" font-weight="650" fill="#17293a">Sensor</text>
<text x="240" y="184.0" font-size="18" text-anchor="middle" font-weight="400" fill="#17293a">Temperatur messen</text>
<rect x="604.0" y="132.0" width="232" height="66" rx="10" fill="#f2f7fb" stroke="#476174" stroke-width="2"/>
<text x="720" y="160.0" font-size="22" text-anchor="middle" font-weight="650" fill="#17293a">Regler</text>
<text x="720" y="184.0" font-size="15" text-anchor="middle" font-weight="400" fill="#17293a">Schaltzustand bestimmen</text>
<rect x="604.0" y="322.0" width="232" height="66" rx="10" fill="#f2f7fb" stroke="#476174" stroke-width="2"/>
<text x="720" y="350.0" font-size="22" text-anchor="middle" font-weight="650" fill="#17293a">Aktor</text>
<text x="720" y="374.0" font-size="18" text-anchor="middle" font-weight="400" fill="#17293a">Heizung schalten</text>
<rect x="124.0" y="322.0" width="232" height="66" rx="10" fill="#f2f7fb" stroke="#476174" stroke-width="2"/>
<text x="240" y="350.0" font-size="22" text-anchor="middle" font-weight="650" fill="#17293a">Raum</text>
<text x="240" y="374.0" font-size="15" text-anchor="middle" font-weight="400" fill="#17293a">Temperatur ändert sich</text>
</g>
</svg>
