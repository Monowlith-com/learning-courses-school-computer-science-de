<title id="title">Eine Klasse, zwei Instanzen</title>
<desc id="description">Aus Room entstehen Raum 1 mit zwei Plätzen und Raum 2 mit einem Platz. Nach einer Reservierung in Raum 1 ist dort ein Platz belegt und in Raum 2 keiner.</desc>
