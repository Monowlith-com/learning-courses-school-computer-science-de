<text x="517.0" y="258.0" font-size="17" text-anchor="middle" font-weight="400" fill="#17293a">ja</text>
<path d="M284.0 301.0 Q284.0 325.0 284.0 349.0" fill="none" stroke="#476174" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="261.0" y="299.0" width="46" height="22" rx="4" fill="#fff"/>
<text x="284.0" y="315.0" font-size="17" text-anchor="middle" font-weight="400" fill="#17293a">nein</text>
