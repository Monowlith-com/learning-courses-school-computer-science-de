<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-labelledby="title description" xml:lang="de">
<title id="title">Entscheidung über freie Plätze</title>
<desc id="description">Bei null freien Plätzen lautet die Meldung voll. Andernfalls führt die Prüfung auf weniger als drei zu wenige, wenn sie wahr ist, und zu frei, wenn sie falsch ist.</desc>
