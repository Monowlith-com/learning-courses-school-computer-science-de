<svg xmlns="http://www.w3.org/2000/svg" xml:lang="de" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="image-title image-description">
<title id="image-title">Entfernungsebenen bei der Breitensuche</title>
<desc id="image-description">A steht in Ebene 0, B und C in Ebene 1, D und E in Ebene 2 und F in Ebene 3. Durchgehende Kanten verbinden A mit B und C, B mit D, C mit E sowie D mit F. Die Zusatzkanten C–D und E–F sind gestrichelt. G bleibt unerreichbar.</desc>
<rect width="960" height="480" fill="#fff"/>
<g font-family="Arial, sans-serif">
<text x="44" y="55" text-anchor="start" font-size="34" font-weight="700" fill="#1b3047">Entfernungsebenen bei der Breitensuche</text>
<line x1="44" y1="78" x2="916" y2="78" stroke="#d5dbe2" stroke-width="2" />
<text x="115" y="118" text-anchor="middle" font-size="21" font-weight="700" fill="#1b3047">Ebene 0</text>
<text x="353" y="118" text-anchor="middle" font-size="21" font-weight="700" fill="#1b3047">Ebene 1</text>
<text x="590" y="118" text-anchor="middle" font-size="21" font-weight="700" fill="#1b3047">Ebene 2</text>
<text x="826" y="118" text-anchor="middle" font-size="21" font-weight="700" fill="#1b3047">Ebene 3</text>
<line x1="353" y1="288" x2="590" y2="172" stroke="#677485" stroke-width="3" stroke-dasharray="9 7"/>
<line x1="590" y1="288" x2="826" y2="230" stroke="#677485" stroke-width="3" stroke-dasharray="9 7"/>
