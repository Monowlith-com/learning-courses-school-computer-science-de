<line x1="115" y1="230" x2="353" y2="288" stroke="#225f83" stroke-width="4" />
<line x1="353" y1="172" x2="590" y2="172" stroke="#225f83" stroke-width="4" />
<line x1="353" y1="288" x2="590" y2="288" stroke="#225f83" stroke-width="4" />
<line x1="590" y1="172" x2="826" y2="230" stroke="#225f83" stroke-width="4" />
<circle cx="115" cy="230" r="26" fill="#eef5fa" stroke="#225f83" stroke-width="3"/>
<text x="115" y="238" text-anchor="middle" font-size="23" font-weight="700" fill="#1b3047">A</text>
<circle cx="353" cy="172" r="26" fill="#eef5fa" stroke="#225f83" stroke-width="3"/>
<text x="353" y="180" text-anchor="middle" font-size="23" font-weight="700" fill="#1b3047">B</text>
<circle cx="353" cy="288" r="26" fill="#eef5fa" stroke="#225f83" stroke-width="3"/>
<text x="353" y="296" text-anchor="middle" font-size="23" font-weight="700" fill="#1b3047">C</text>
<circle cx="590" cy="172" r="26" fill="#eef5fa" stroke="#225f83" stroke-width="3"/>
<text x="590" y="180" text-anchor="middle" font-size="23" font-weight="700" fill="#1b3047">D</text>
<circle cx="590" cy="288" r="26" fill="#eef5fa" stroke="#225f83" stroke-width="3"/>
<text x="590" y="296" text-anchor="middle" font-size="23" font-weight="700" fill="#1b3047">E</text>
<circle cx="826" cy="230" r="26" fill="#eef5fa" stroke="#225f83" stroke-width="3"/>
<text x="826" y="238" text-anchor="middle" font-size="23" font-weight="700" fill="#1b3047">F</text>
<circle cx="826" cy="340" r="26" fill="#fff" stroke="#677485" stroke-width="3"/>
