<svg xmlns="http://www.w3.org/2000/svg" xml:lang="de" viewBox="0 0 960 480" width="960" height="480" role="img" aria-labelledby="title desc">
<title id="title">Eine Schwelle trainieren und prüfen</title>
<desc id="desc">Vier Trainingsfälle führen zur Schwelle 5. Sechs separate Testfälle ergeben zwei richtig positive, einen falsch positiven, einen falsch negativen und zwei richtig negative Fälle.</desc>
<rect x="0" y="0" width="960" height="480" fill="#fff"/>
<g font-family="Arial, sans-serif">
<text x="52" y="62" font-size="34" text-anchor="start" fill="#122235" font-weight="700">Eine Schwelle trainieren und prüfen</text>
<line x1="52" y1="82" x2="908" y2="82" stroke="#aab6c0" stroke-width="2"/>
<rect x="55" y="110" width="266" height="88" fill="#fff" stroke="#122235" stroke-width="2" rx="8"/>
<text x="188" y="146" font-size="22" text-anchor="middle" fill="#122235" font-weight="700">Trainingsdaten</text>
<text x="188" y="174" font-size="20" text-anchor="middle" fill="#122235">4 beschriftete Fälle</text>
<line x1="324" y1="154" x2="342" y2="154" stroke="#122235" stroke-width="2"/>
<line x1="337" y1="149" x2="342" y2="154" stroke="#122235" stroke-width="2"/>
<line x1="337" y1="159" x2="342" y2="154" stroke="#122235" stroke-width="2"/>
<rect x="347" y="110" width="266" height="88" fill="#fff" stroke="#122235" stroke-width="2" rx="8"/>
<text x="480" y="146" font-size="22" text-anchor="middle" fill="#122235" font-weight="700">Schwelle wählen</text>
<text x="480" y="174" font-size="20" text-anchor="middle" fill="#122235">5 festschreiben</text>
<line x1="616" y1="154" x2="634" y2="154" stroke="#122235" stroke-width="2"/>
<line x1="629" y1="149" x2="634" y2="154" stroke="#122235" stroke-width="2"/>
<line x1="629" y1="159" x2="634" y2="154" stroke="#122235" stroke-width="2"/>
<rect x="639" y="110" width="266" height="88" fill="#fff" stroke="#122235" stroke-width="2" rx="8"/>
<text x="772" y="146" font-size="22" text-anchor="middle" fill="#122235" font-weight="700">Getrennte Testdaten</text>
<text x="772" y="174" font-size="20" text-anchor="middle" fill="#122235">6 Fälle auswerten</text>
<text x="55" y="246" font-size="27" text-anchor="start" fill="#122235" font-weight="700">Konfusionsmatrix für die Testfälle</text>
<line x1="55" y1="271" x2="905" y2="271" stroke="#aab6c0" stroke-width="2"/>
<text x="73" y="305" font-size="22" text-anchor="start" fill="#122235" font-weight="700">Referenz</text>
<text x="460" y="305" font-size="22" text-anchor="middle" fill="#122235" font-weight="700">Vorhersage: gießen</text>
<text x="740" y="305" font-size="22" text-anchor="middle" fill="#122235" font-weight="700">Vorhersage: warten</text>
<line x1="55" y1="325" x2="905" y2="325" stroke="#aab6c0" stroke-width="2"/>
<text x="73" y="359" font-size="22" text-anchor="start" fill="#122235">Gießen (1)</text>
<text x="460" y="359" font-size="22" text-anchor="middle" fill="#122235">2</text>
<text x="740" y="359" font-size="22" text-anchor="middle" fill="#122235">1</text>
<line x1="55" y1="379" x2="905" y2="379" stroke="#aab6c0" stroke-width="2"/>
<text x="73" y="413" font-size="22" text-anchor="start" fill="#122235">Warten (0)</text>
<text x="460" y="413" font-size="22" text-anchor="middle" fill="#122235">1</text>
<text x="740" y="413" font-size="22" text-anchor="middle" fill="#122235">2</text>
<line x1="55" y1="433" x2="905" y2="433" stroke="#aab6c0" stroke-width="2"/>
</g>
</svg>
