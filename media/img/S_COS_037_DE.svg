<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-labelledby="title description" xml:lang="de">
<title id="title">Messdaten für Anzeige und Netzdienst</title>
<desc id="description">Der Messdienst liest den Sensor und aktualisiert den Messwertspeicher. Anzeige und Netzdienst lesen daraus über getrennte Pfade. Der Netzdienst steuert die Anzeige nicht.</desc>
