<rect x="38.0" y="119.0" width="273.3333333333333" height="122" rx="10" fill="#f2f7fb" stroke="#476174" stroke-width="2"/>
<text x="174.66666666666666" y="163.0" font-size="22" text-anchor="middle" font-weight="650" fill="#17293a">Tablet</text>
<text x="174.66666666666666" y="187.0" font-size="18" text-anchor="middle" font-weight="400" fill="#17293a">Anfrage vormerken</text>
<text x="174.66666666666666" y="211.0" font-size="18" text-anchor="middle" font-weight="400" fill="#17293a">Status: wartend</text>
<path d="M315.3333333333333 180 H338.3333333333333" fill="none" stroke="#476174" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="343.33333333333337" y="119.0" width="273.3333333333333" height="122" rx="10" fill="#f2f7fb" stroke="#476174" stroke-width="2"/>
<text x="480.0" y="163.0" font-size="22" text-anchor="middle" font-weight="650" fill="#17293a">Server</text>
<text x="480.0" y="187.0" font-size="18" text-anchor="middle" font-weight="400" fill="#17293a">Termin prüfen</text>
<text x="480.0" y="211.0" font-size="18" text-anchor="middle" font-weight="400" fill="#17293a">Entscheidung speichern</text>
<path d="M620.6666666666666 180 H643.6666666666666" fill="none" stroke="#476174" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="648.6666666666666" y="119.0" width="273.3333333333333" height="122" rx="10" fill="#f2f7fb" stroke="#476174" stroke-width="2"/>
