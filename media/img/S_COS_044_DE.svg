<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 325" width="960" height="325" role="img" aria-labelledby="title description" xml:lang="de">
<title id="title">Buchungsanfrage und Zusage</title>
<desc id="description">Das Tablet hält eine Anfrage mit Kennung als wartend. Der Server entscheidet für den gemeinsamen Termin und speichert bei Zusage die Reservierung. Die Anwendung zeigt anschließend Zusage oder Absage.</desc>
<defs><marker id="arrow" orient="auto" markerWidth="8" markerHeight="7" refX="7.4" refY="3.5"><path d="M0 0 L8 3.5 L0 7 Z" fill="#476174"/></marker></defs>
<rect width="960" height="325" fill="#fff"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="38" y="57" font-size="31" text-anchor="start" font-weight="700" fill="#17293a">Buchungsanfrage und Zusage</text>
